name: IGNIDOWake
options:
  bundleIdPrefix: jp.ignido
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  IGNIDOWake:
    type: application
    platform: iOS
    sources:
      - path: IGNIDOWake
    info:
      path: IGNIDOWake/Info.plist
      properties:
        CFBundleDisplayName: IGNIDO Wake
        CFBundleName: IGNIDO Wake
        CFBundleShortVersionString: "1.7.4"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: "IGNIDO Wakeで設定した目覚まし・アラームとタイマーを指定時刻に鳴らすために使用します。"
        NSMotionUsageDescription: "アラーム解除の歩数・シェイク判定にiPhoneのモーションセンサーを使用します。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.ignido.wake
        PRODUCT_NAME: IGNIDOWake
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
