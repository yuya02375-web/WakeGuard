name: IGNIDOWake
options:
  bundleIdPrefix: jp.ignido
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  IGNIDOWake:
    type: application
    platform: iOS
    sources:
      - path: IGNIDOWake
    info:
      path: IGNIDOWake/Info.plist
      properties:
        CFBundleDisplayName: IGNIDO Wake
        CFBundleName: IGNIDO Wake
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: "IGNIDO Wakeで設定した目覚まし・アラームを指定時刻に鳴らすために使用します。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.ignido.wake
        PRODUCT_NAME: IGNIDOWake
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
