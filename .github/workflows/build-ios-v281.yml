name: Build IGNIDO Wake iOS 2.8.1 Visible 3D Dragon
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_ios_v281_visible_3d_dragon.py'
      - '.github/workflows/build-ios-v281.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Restore exact iOS 2.8.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/i280 && mkdir -p /tmp/i280
          curl -L --fail --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11325548997/zip             -o /tmp/i280.zip
          unzip -q /tmp/i280.zip -d /tmp/i280
          test -f /tmp/i280/ios/IGNIDOWake/StreakParity.swift
          rm -rf ios/IGNIDOWake
          cp -R /tmp/i280/ios/IGNIDOWake ios/IGNIDOWake
          cp /tmp/i280/ios/project.yml ios/project.yml
      - name: Apply iOS 2.8.1 visible dragon fix
        run: python3 tools/patch_ios_v281_visible_3d_dragon.py
      - name: Validate 2.8.1
        run: |
          grep -q '<string>2.8.1</string>' ios/IGNIDOWake/Info.plist
          grep -q '<string>181</string>' ios/IGNIDOWake/Info.plist
          grep -q 'view.pointOfView = cameraNode' ios/IGNIDOWake/StreakParity.swift
          grep -q 'scene.lightingEnvironment.intensity = 0.85' ios/IGNIDOWake/StreakParity.swift
          grep -q 'm.blendMode = .replace' ios/IGNIDOWake/StreakParity.swift
          grep -q 'dragon.opacity = level >= 21 ? 1.0' ios/IGNIDOWake/StreakParity.swift
          grep -q 'IgnidoBackupVault.restoreIfNeeded()' ios/IGNIDOWake/IGNIDOWakeApp.swift
          grep -q 'すべて取消' ios/IGNIDOWake/AlarmViews.swift
          test -s ios/IGNIDOWake/dragon_realistic.dae
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project IGNIDOWake.xcodeproj -scheme IGNIDOWake -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '2.8.1'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '181'
          test -s "$APP/dragon_realistic.dae"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon.ipa Payload
          unzip -t IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon.ipa
          shasum -a 256 IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon.ipa | tee IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon-source
          path: |
            ios/IGNIDOWake/
            ios/project.yml
            tools/patch_ios_v281_visible_3d_dragon.py
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon
          path: |
            ios/IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon.ipa
            ios/IGNIDO-Wake-iOS-2.8.1-visible-3d-dragon.sha256
