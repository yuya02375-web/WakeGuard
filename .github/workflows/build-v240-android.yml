name: Build IGNIDO Wake Android 2.4.0 Streak + Stopwatch Import
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v240_streak_stopwatch_import_android.py'
      - '.github/workflows/build-v240-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -t WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a230 && mkdir -p /tmp/a230
          gh run download 36226859290 -n IGNIDO-Wake-Android-2.3.0-native-ui-polish-source -D /tmp/a230
          test -f /tmp/a230/WakeGuard/app/src/main/java/jp/wakeguard/alarm/StatsActivity.java
          rm -rf WakeGuard/app
          cp -R /tmp/a230/WakeGuard/app WakeGuard/app
      - name: Apply Android 2.4.0 patch
        run: python3 tools/patch_v240_streak_stopwatch_import_android.py
      - name: Validate 2.4.0 features
        run: |
          grep -q 'versionCode = 140' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.4.0"' WakeGuard/app/build.gradle.kts
          grep -q 'Ui.dp(this,170),Ui.dp(this,220)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StatsActivity.java
          ! grep -q '起床に成功するたびに、同じ1体' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StatsActivity.java
          grep -q 'KEY_SW_LAP_WALLS' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q '時間記録に追加' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'ラップから追加' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'showImportFolderPicker' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
          grep -q 'あと "+relativeText(next-now)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/MainActivity.java
          grep -q 'Button del=Ui.ghostButton(this,"削除")' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import-source
          path: |
            WakeGuard/app/
            tools/patch_v240_streak_stopwatch_import_android.py
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          test -n "$WAKEGUARD_KEYSTORE_B64"
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
          chmod 600 "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Enable AndroidX
        run: |
          sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          grep -q '^android.useAndroidX=true' WakeGuard/gradle.properties
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/wakeguard-release.p12"             --ks-type PKCS12             --ks-key-alias "$WAKEGUARD_KEY_ALIAS"             --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD             --key-pass env:WAKEGUARD_KEY_PASSWORD             --v2-signing-enabled true             --v3-signing-enabled true             --out IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import.apk             WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import.apk
          sha256sum IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import.apk | tee IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import
          path: |
            IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import.apk
            IGNIDO-Wake-Android-2.4.0-streak-stopwatch-import.sha256
