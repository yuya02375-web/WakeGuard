name: Build IGNIDO Wake Android 2.7.0 Real 3D Dragon
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v270_3d_dragon_android.py'
      - '.github/workflows/build-v270-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.6.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a260 && mkdir -p /tmp/a260
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11025001249/zip \
            -o /tmp/a260.zip
          unzip -q /tmp/a260.zip -d /tmp/a260
          test -f /tmp/a260/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          rm -rf WakeGuard/app
          mkdir -p WakeGuard/app
          cp -R /tmp/a260/. WakeGuard/app/
      - name: Apply Android 2.7.0 3D patch
        run: python3 tools/patch_v270_3d_dragon_android.py
      - name: Add licensed 3D dragon asset
        run: |
          mkdir -p WakeGuard/app/src/main/assets
          curl -L --fail --retry 3             https://raw.githubusercontent.com/N8python/caustics/fa4890cbe16f1e3dc1be5dfefbd01f6932b2ea88/dragon.glb             -o WakeGuard/app/src/main/assets/dragon_realistic.glb
          curl -L --fail --retry 3             https://raw.githubusercontent.com/N8python/caustics/fa4890cbe16f1e3dc1be5dfefbd01f6932b2ea88/LICENSE             -o WakeGuard/app/src/main/assets/THIRD_PARTY_DRAGON_LICENSE.txt
          cat > WakeGuard/app/src/main/assets/THIRD_PARTY_DRAGON_SOURCE.txt <<'EOF'
          IGNIDO Wake 3D dragon asset
          Source: https://github.com/N8python/caustics
          Pinned commit: fa4890cbe16f1e3dc1be5dfefbd01f6932b2ea88
          Asset: dragon.glb
          License: CC0 1.0 Universal (see THIRD_PARTY_DRAGON_LICENSE.txt)
          EOF
          test $(stat -c%s WakeGuard/app/src/main/assets/dragon_realistic.glb) -gt 1000000
      - name: Validate 2.7.0
        run: |
          grep -q 'versionCode = 170' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.7.0"' WakeGuard/app/build.gradle.kts
          grep -q 'filament-android:1.77.1' WakeGuard/app/build.gradle.kts
          grep -q 'gltfio-android:1.77.1' WakeGuard/app/build.gradle.kts
          grep -q 'filament-utils-android:1.77.1' WakeGuard/app/build.gradle.kts
          grep -q 'new ModelViewer' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'loadModelGlb' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'KEY_SW_LAP_WALLS' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'showImportFolderPicker' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.7.0-real-3d-dragon-source
          path: WakeGuard/app/
      - name: Enable AndroidX
        run: sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/wakeguard-release.p12"             --ks-type PKCS12             --ks-key-alias "$WAKEGUARD_KEY_ALIAS"             --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD             --key-pass env:WAKEGUARD_KEY_PASSWORD             --v2-signing-enabled true             --v3-signing-enabled true             --out IGNIDO-Wake-Android-2.7.0-real-3d-dragon.apk             WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.7.0-real-3d-dragon.apk
          sha256sum IGNIDO-Wake-Android-2.7.0-real-3d-dragon.apk | tee IGNIDO-Wake-Android-2.7.0-real-3d-dragon.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.7.0-real-3d-dragon
          path: |
            IGNIDO-Wake-Android-2.7.0-real-3d-dragon.apk
            IGNIDO-Wake-Android-2.7.0-real-3d-dragon.sha256
