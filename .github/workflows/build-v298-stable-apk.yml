name: Build IGNIDO Wake 2.10.0 Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/restore-v295
    paths:
      - '.github/workflows/build-v298-stable-apk.yml'
      - 'app/**'
      - '.wakeguard-parts/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore Gradle project skeleton
        shell: bash
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > "$RUNNER_TEMP/WakeGuard-root.zip"
          unzip -q "$RUNNER_TEMP/WakeGuard-root.zip" -d .
          test -f WakeGuard/settings.gradle.kts
          test -f WakeGuard/gradle.properties

      - name: Use app sources from this commit
        shell: bash
        run: |
          rm -rf WakeGuard/app
          cp -R app WakeGuard/app
          grep -Fq 'versionCode = 200' WakeGuard/app/build.gradle.kts
          grep -Fq 'versionName = "2.10.0"' WakeGuard/app/build.gradle.kts
          for launcher in \
            WakeGuard/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            WakeGuard/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml \
            WakeGuard/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml \
            WakeGuard/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml; do
            grep -Fq 'ic_ignido_approved_foreground' "$launcher"
          done
          for launcher in \
            WakeGuard/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml \
            WakeGuard/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml; do
            grep -Fq 'ic_ignido_approved_monochrome' "$launcher"
          done
          test -s WakeGuard/app/src/main/res/drawable-nodpi/ic_ignido_approved_foreground.png
          test -s WakeGuard/app/src/main/res/drawable-nodpi/ic_ignido_approved_monochrome.png

      - name: Enable AndroidX
        working-directory: WakeGuard
        shell: bash
        run: |
          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

      - name: Check app version and signing secrets
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        working-directory: WakeGuard
        shell: bash
        run: |
          grep -Fq 'applicationId = "jp.wakeguard.alarm"' app/build.gradle.kts
          grep -Fq 'versionCode = 200' app/build.gradle.kts
          grep -Fq 'versionName = "2.10.0"' app/build.gradle.kts
          test -n "$WAKEGUARD_KEYSTORE_B64"
          test -n "$WAKEGUARD_KEYSTORE_PASSWORD"
          test -n "$WAKEGUARD_KEY_ALIAS"
          test -n "$WAKEGUARD_KEY_PASSWORD"

      - name: Build release APK
        working-directory: WakeGuard
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        shell: bash
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
          chmod 600 "$RUNNER_TEMP/wakeguard-release.p12"

      - name: Sign and verify stable APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          INPUT="WakeGuard/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="WakeGuard-2.10.0-stable.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/wakeguard-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$WAKEGUARD_KEY_ALIAS" \
            --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD \
            --key-pass env:WAKEGUARD_KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT" \
            "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="DB95A00E32A6B4C3F54D43B91CF67155DCA7057C2C0EE145F5FB98178F311C2E"
          test "$ACTUAL" = "$EXPECTED"
          "$AAPT" dump badging "$OUTPUT" | grep -F "package: name='jp.wakeguard.alarm' versionCode='200' versionName='2.10.0'"
          "$AAPT2" dump resources "$OUTPUT" > "$RUNNER_TEMP/apk-resources.txt"
          grep -Fq 'drawable/ic_ignido_approved_foreground' "$RUNNER_TEMP/apk-resources.txt"
          grep -Fq 'drawable/ic_ignido_approved_monochrome' "$RUNNER_TEMP/apk-resources.txt"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: WakeGuard-2.10.0-stable
          path: |
            WakeGuard-2.10.0-stable.apk
            WakeGuard-2.10.0-stable.apk.sha256
