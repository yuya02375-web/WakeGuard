name: Build IGNIDO Wake Android 2.0.1 World Overview
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v201_world_clock_overview_android.py'
      - '.github/workflows/build-v201-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -t WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.0.0 app source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/android200 && mkdir -p /tmp/android200
          gh run download 35174077910 -n IGNIDO-Wake-Android-2.0.0-parity-source -D /tmp/android200
          test -f /tmp/android200/WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          rm -rf WakeGuard/app
          cp -R /tmp/android200/WakeGuard/app WakeGuard/app
      - name: Apply Android 2.0.1 world overview patch
        run: python3 tools/patch_v201_world_clock_overview_android.py
      - name: Validate world overview invariants
        run: |
          grep -q 'versionName = "2.0.1"' WakeGuard/app/build.gradle.kts
          grep -q 'versionCode = 101' WakeGuard/app/build.gradle.kts
          grep -q 'world_overview_v201' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'buildWorldOverview' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'compactDayLabel' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'isExpectedFire' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmScheduler.java
          grep -q 'launchTimerVideo' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimerReceiver.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.0.1-world-overview-source
          path: |
            WakeGuard/app/
            tools/patch_v201_world_clock_overview_android.py
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          test -n "$WAKEGUARD_KEYSTORE_B64"
          test -n "$WAKEGUARD_KEYSTORE_PASSWORD"
          test -n "$WAKEGUARD_KEY_ALIAS"
          test -n "$WAKEGUARD_KEY_PASSWORD"
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
          chmod 600 "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/wakeguard-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$WAKEGUARD_KEY_ALIAS" \
            --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD \
            --key-pass env:WAKEGUARD_KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out IGNIDO-Wake-Android-2.0.1-world-overview.apk \
            WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.0.1-world-overview.apk
          sha256sum IGNIDO-Wake-Android-2.0.1-world-overview.apk | tee IGNIDO-Wake-Android-2.0.1-world-overview.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.0.1-world-overview
          path: |
            IGNIDO-Wake-Android-2.0.1-world-overview.apk
            IGNIDO-Wake-Android-2.0.1-world-overview.sha256
