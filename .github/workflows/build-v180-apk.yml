name: Build IGNIDO Wake v1.8.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct source archive
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -t WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip

      - name: Download GeoNames world city catalog
        run: |
          curl -fsSL --retry 4 --retry-delay 2 https://download.geonames.org/export/dump/cities15000.zip -o /tmp/cities15000.zip
          unzip -p /tmp/cities15000.zip cities15000.txt > /tmp/cities15000.txt
          test -s /tmp/cities15000.txt

      - name: Apply IGNIDO Wake v1.8.0 patch set
        run: |
          python3 tools/patch_v156_runner.py
          python3 tools/patch_v157.py
          python3 tools/patch_v158.py
          python3 tools/patch_v159.py
          python3 tools/patch_v160.py
          python3 tools/patch_v161.py
          python3 tools/patch_v162.py
          python3 tools/patch_v163.py
          python3 tools/patch_v164.py
          python3 tools/patch_v165.py
          python3 tools/patch_v166.py
          python3 tools/patch_v167.py
          python3 tools/patch_v168.py
          python3 tools/patch_v169.py
          python3 tools/patch_v170.py
          python3 tools/patch_v171_prepare.py
          python3 tools/patch_v172.py
          python3 tools/patch_v173_design.py
          python3 tools/patch_v174_fire.py
          python3 tools/patch_v175_clock_surface.py
          python3 tools/patch_v176_clean_initial_state.py
          python3 tools/patch_v177_android_ux.py
          python3 tools/patch_v178_video_overlay.py
          python3 tools/patch_v179_fast_trilingual_search.py
          python3 tools/patch_v180_ghost_guard_timer_video.py
          grep -n 'versionName = "1.8.0"' WakeGuard/app/build.gradle.kts
          grep -n 'versionCode = 91' WakeGuard/app/build.gradle.kts
          grep -q 'isExpectedFire' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmScheduler.java
          grep -q 'AlarmOccurrenceGuard' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmReceiver.java
          grep -q 'launchTimerVideo' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimerReceiver.java
          grep -q 'MODE_BACKGROUND_ACTIVITY_START_ALLOW_ALWAYS' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimerReceiver.java

      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-v1.8.0-patched-source
          path: |
            WakeGuard/app/src/main/java/jp/wakeguard/alarm/*.java
            WakeGuard/app/src/main/AndroidManifest.xml
            WakeGuard/app/src/main/res/
            WakeGuard/app/src/main/assets/
            WakeGuard/app/build.gradle.kts

      - name: Validate stable signing secrets
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          test -n "$WAKEGUARD_KEYSTORE_B64"
          test -n "$WAKEGUARD_KEYSTORE_PASSWORD"
          test -n "$WAKEGUARD_KEY_ALIAS"
          test -n "$WAKEGUARD_KEY_PASSWORD"

      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
          chmod 600 "$RUNNER_TEMP/wakeguard-release.p12"

      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace

      - name: Sign APK with stable key
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/wakeguard-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$WAKEGUARD_KEY_ALIAS" \
            --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD \
            --key-pass env:WAKEGUARD_KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out IGNIDO-Wake-v1.8.0-stable.apk \
            WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-v1.8.0-stable.apk
          sha256sum IGNIDO-Wake-v1.8.0-stable.apk | tee IGNIDO-Wake-v1.8.0-stable.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-v1.8.0-stable-apk
          path: |
            IGNIDO-Wake-v1.8.0-stable.apk
            IGNIDO-Wake-v1.8.0-stable.sha256
