name: Build IGNIDO Wake Android 2.5.0 Visible Dragon
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v250_visible_dragon_android.py'
      - '.github/workflows/build-v250-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.4.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a242 && mkdir -p /tmp/a242
          gh run download 36545116317 -n IGNIDO-Wake-Android-2.4.2-big-flame-ui-source -D /tmp/a242
          rm -rf WakeGuard/app
          cp -R /tmp/a242/WakeGuard/app WakeGuard/app
      - name: Apply patch
        run: python3 tools/patch_v250_visible_dragon_android.py
      - name: Validate
        run: |
          grep -q 'versionName = "2.5.0"' WakeGuard/app/build.gradle.kts
          grep -q 'float dragonAt(vec2 uv)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'dragonBody\*0.88' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.5.0-visible-dragon-source
          path: WakeGuard/app/
      - name: Enable AndroidX
        run: sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.5.0-visible-dragon-unsigned
          path: WakeGuard/app/build/outputs/apk/debug/app-debug.apk
