name: Build IGNIDO Wake Android 2.2.0 Relative Alarm + Time Log Stopwatch
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/v220a_safe*'
      - '.github/workflows/build-v220-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -t WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.1.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a211 && mkdir -p /tmp/a211
          gh run download 36083930927 -n IGNIDO-Wake-Android-2.1.1-midnight-time-log-fix-source -D /tmp/a211
          test -f /tmp/a211/WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
          rm -rf WakeGuard/app
          cp -R /tmp/a211/WakeGuard/app WakeGuard/app
      - name: Apply Android 2.2.0 patch
        run: |
          cat tools/v220a_safe00 tools/v220a_safe01 tools/v220a_safe02 tools/v220a_safe03 > /tmp/v220-android.patch
          patch -p1 --fuzz=0 < /tmp/v220-android.patch
      - name: Validate 2.2.0 changes
        run: |
          grep -q 'versionCode = 120' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.2.0"' WakeGuard/app/build.gradle.kts
          grep -q 'Ui.applySystemBarInsets(this,root)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
          grep -q 'KEY_ACTIVE_FOLDER' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
          grep -q 'onBackPressed' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
          grep -q 'stopAndRegisterTracking' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
          grep -q 'fixedAt' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmStore.java
          grep -q 'showAfterDialog' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmEditorActivity.java
          grep -q 'fixedAt>0L' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmScheduler.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch-source
          path: |
            WakeGuard/app/
            tools/v220a_safe00
            tools/v220a_safe01
            tools/v220a_safe02
            tools/v220a_safe03
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          test -n "$WAKEGUARD_KEYSTORE_B64"
          test -n "$WAKEGUARD_KEYSTORE_PASSWORD"
          test -n "$WAKEGUARD_KEY_ALIAS"
          test -n "$WAKEGUARD_KEY_PASSWORD"
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
          chmod 600 "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Enable AndroidX
        run: |
          sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          grep -q '^android.useAndroidX=true' WakeGuard/gradle.properties
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/wakeguard-release.p12"             --ks-type PKCS12             --ks-key-alias "$WAKEGUARD_KEY_ALIAS"             --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD             --key-pass env:WAKEGUARD_KEY_PASSWORD             --v2-signing-enabled true             --v3-signing-enabled true             --out IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch.apk             WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch.apk
          sha256sum IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch.apk | tee IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch
          path: |
            IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch.apk
            IGNIDO-Wake-Android-2.2.0-relative-alarm-time-log-stopwatch.sha256
