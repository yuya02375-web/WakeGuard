name: Build IGNIDO Wake Android 2.9.5 Original Icon and Natural UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v295_original_icon_ui.py'
      - '.github/workflows/build-v295-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore exact Android 2.9.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > /tmp/WakeGuard-source.zip
          unzip -q /tmp/WakeGuard-source.zip
          mkdir -p /tmp/base294
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/13043453541/zip -o /tmp/base294.zip
          unzip -q /tmp/base294.zip -d /tmp/base294
          test -s /tmp/base294/IGNIDO-Wake-Android-2.9.4-clean-clock-icon-source.zip
          rm -rf WakeGuard/app
          unzip -q /tmp/base294/IGNIDO-Wake-Android-2.9.4-clean-clock-icon-source.zip 'app/*' -d WakeGuard
          test -f WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
      - name: Restore original foreground artwork and refine app UI
        working-directory: WakeGuard
        run: python3 ../tools/patch_v295_original_icon_ui.py
      - name: Verify clean icon, adaptive theme and alarm regression
        run: |
          grep -q 'versionCode = 195' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.9.5"' WakeGuard/app/build.gradle.kts
          grep -q 'ic_ignido_v295_foreground' WakeGuard/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s WakeGuard/app/src/main/res/drawable-nodpi/ic_ignido_v295_foreground.png
          grep -q '細かく調整' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'ic_ignido_v294_mono' WakeGuard/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          grep -q 'Reentered scheduled UI' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmActivity.java
          grep -q 'appearanceLevel' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakGrowth.java
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          from pathlib import Path
          base=Path('WakeGuard/app/src/main/res')
          for name in ['ic_ignido_v294_fg.xml','ic_ignido_v294_mono.xml','ic_ignido_notification.xml']:
              E.parse(base/'drawable'/name)
          for f in base.glob('mipmap-anydpi-v*/ic_launcher*.xml'):
              E.parse(f)
          print('Original clock artwork and adaptive launcher resources validated')
          PY
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Make UI screenshot directory
        run: mkdir -p ui-v295
      - name: Capture six Japanese UI screens and alarm regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r WakeGuard/app/build/outputs/apk/debug/app-debug.apk
            adb root
            adb wait-for-device
            adb shell pm grant jp.wakeguard.alarm android.permission.POST_NOTIFICATIONS
            adb shell pm grant jp.wakeguard.alarm android.permission.ACTIVITY_RECOGNITION
            adb shell cmd locale set-app-locales jp.wakeguard.alarm --locales ja-JP
            adb logcat -c
            adb shell am start -W -n jp.wakeguard.alarm/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/alarms.png
            adb pull /sdcard/alarms.png ui-v295/alarms.png
            adb shell am force-stop jp.wakeguard.alarm
            adb shell am start -W -n jp.wakeguard.alarm/.ClockActivity --es mode world
            sleep 2
            adb shell screencap -p /sdcard/world.png
            adb pull /sdcard/world.png ui-v295/world.png
            adb shell am force-stop jp.wakeguard.alarm
            adb shell am start -W -n jp.wakeguard.alarm/.ClockActivity --es mode timer
            sleep 2
            adb shell screencap -p /sdcard/timer.png
            adb pull /sdcard/timer.png ui-v295/timer.png
            adb shell am force-stop jp.wakeguard.alarm
            adb shell am start -W -n jp.wakeguard.alarm/.ClockActivity --es mode stopwatch
            sleep 2
            adb shell screencap -p /sdcard/stopwatch.png
            adb pull /sdcard/stopwatch.png ui-v295/stopwatch.png
            adb shell am start -W -n jp.wakeguard.alarm/.StatsActivity
            sleep 3
            adb shell screencap -p /sdcard/streak.png
            adb pull /sdcard/streak.png ui-v295/streak.png
            adb shell am start -W -n jp.wakeguard.alarm/.AlarmEditorActivity --el alarmId -1
            sleep 2
            adb shell screencap -p /sdcard/editor.png
            adb pull /sdcard/editor.png ui-v295/editor.png
            adb shell am start-foreground-service -n jp.wakeguard.alarm/.AlarmService -a jp.wakeguard.alarm.FIRE_TEST --el alarmId 1
            sleep 4
            adb shell am start -W -n jp.wakeguard.alarm/.AlarmActivity
            sleep 2
            adb shell am start -W -f 0x34000000 -n jp.wakeguard.alarm/.AlarmActivity -a jp.wakeguard.alarm.UI_SCHEDULED_FIRE --el alarmId 1 --el epochDay 0 --el expectedAt 0
            sleep 4
            adb shell pidof jp.wakeguard.alarm
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -q 'jp.wakeguard.alarm/.AlarmActivity'
            adb logcat -d -v brief > ui-v295/alarm-logcat.txt
            grep -q 'Reentered scheduled UI' ui-v295/alarm-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: jp\\.wakeguard\\.alarm.*died|Fatal signal.*jp\\.wakeguard\\.alarm' ui-v295/alarm-logcat.txt
      - name: Package screenshots
        run: |
          test $(find ui-v295 -name '*.png' | wc -l) -eq 6
          (cd ui-v295 && zip -q ../IGNIDO-Wake-Android-2.9.5-screen-review.zip *.png)
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.9.5-screens
          path: IGNIDO-Wake-Android-2.9.5-screen-review.zip
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/wakeguard-release.p12" --ks-type PKCS12 --ks-key-alias "$WAKEGUARD_KEY_ALIAS" --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD --key-pass env:WAKEGUARD_KEY_PASSWORD --v2-signing-enabled true --v3-signing-enabled true --out IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui.apk WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui.apk
          sha256sum IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui.apk > IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui.sha256
      - name: Package reproducible source
        run: |
          cp tools/patch_v295_original_icon_ui.py WakeGuard/
          mkdir -p WakeGuard/credits
          printf '%s\n' 'IGNIDO classic clock icon is original project artwork.' 'No third-party image asset is required for the app icon.' > WakeGuard/credits/APP_ICON_LICENSE.txt
          rm -rf WakeGuard/app/build WakeGuard/app/.gradle
          (cd WakeGuard && zip -qr ../IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui-source.zip app patch_v295_original_icon_ui.py credits)
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui
          path: |
            IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui.apk
            IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui.sha256
            IGNIDO-Wake-Android-2.9.5-original-icon-natural-ui-source.zip
