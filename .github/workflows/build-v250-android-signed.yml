name: Build IGNIDO Wake Android 2.5.0 Visible Dragon Signed
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v250-android-signed.yml'
      - 'tools/patch_v250_visible_dragon_android.py'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.4.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a242 && mkdir -p /tmp/a242
          gh run download 36545116317 -n IGNIDO-Wake-Android-2.4.2-big-flame-ui-source -D /tmp/a242
          rm -rf WakeGuard/app
          cp -R /tmp/a242/WakeGuard/app WakeGuard/app
      - name: Apply visible dragon renderer
        run: python3 -O tools/patch_v250_visible_dragon_android.py
      - name: Validate
        run: |
          grep -q 'versionName = "2.5.0"' WakeGuard/app/build.gradle.kts
          grep -q 'float dragonAt(vec2 uv)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'dragonBody\*0.88' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'float dragon = smooth((level - 8f) / 24f)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.5.0-visible-dragon-source
          path: WakeGuard/app/
      - name: Enable AndroidX
        run: sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | sed 's/^WAKEGUARD_KEYSTORE_B64=//' | tr -d '"' | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign APK
        env:
          STORE_PASS: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/wakeguard-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --v2-signing-enabled true --v3-signing-enabled true --out IGNIDO-Wake-Android-2.5.0-visible-dragon.apk WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs IGNIDO-Wake-Android-2.5.0-visible-dragon.apk
          sha256sum IGNIDO-Wake-Android-2.5.0-visible-dragon.apk | tee IGNIDO-Wake-Android-2.5.0-visible-dragon.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.5.0-visible-dragon
          path: |
            IGNIDO-Wake-Android-2.5.0-visible-dragon.apk
            IGNIDO-Wake-Android-2.5.0-visible-dragon.sha256
