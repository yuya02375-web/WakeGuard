name: Build IGNIDO Wake iOS 2.0.0 Parity IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_ios_v200_parity.py'
      - 'tools/patch_ios_v200_scope_fix.py'
      - '.github/workflows/build-ios-v197.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Restore exact iOS 1.9.7 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/ios197 && mkdir -p /tmp/ios197
          gh run download 34918469293 -n IGNIDO-Wake-iOS-1.9.7-patched-source -D /tmp/ios197
          test -f /tmp/ios197/ios/IGNIDOWake/AlarmStore.swift
          rm -rf ios/IGNIDOWake
          cp -R /tmp/ios197/ios/IGNIDOWake ios/IGNIDOWake
          cp /tmp/ios197/ios/project.yml ios/project.yml
      - name: Apply iOS 2.0.0 parity patch
        run: |
          python3 tools/patch_ios_v200_parity.py
          python3 tools/patch_ios_v200_scope_fix.py
      - name: Centralize timer firing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/IGNIDOWake/ClockViews.swift')
          s=p.read_text()
          start=s.index('        .fullScreenCover(isPresented: $showMedia) {')
          end=s.index('    }\n\n    private func start()', start)
          p.write_text(s[:start]+'        .onReceive(ticker) { _ in\n            _ = store.remaining\n        }\n'+s[end:])
          PY
      - name: Validate 2.0.0 parity invariants
        run: |
          grep -q '<string>2.0.0</string>' ios/IGNIDOWake/Info.plist
          grep -q '<string>100</string>' ios/IGNIDOWake/Info.plist
          grep -q 'purgeLegacyEscapeGuards()' ios/IGNIDOWake/AlarmStore.swift
          grep -q 'var allowed = enabledAlarmIDs.union(knownTimerIDs)' ios/IGNIDOWake/AlarmStore.swift
          grep -q 'secondaryButtonBehavior: .countdown' ios/IGNIDOWake/AlarmStore.swift
          grep -q 'snoozeSystemAlarm' ios/IGNIDOWake/AlarmStore.swift
          grep -q 'firstAlertingTimer' ios/IGNIDOWake/MultiTimer.swift
          grep -q 'consumeFinishedAlert' ios/IGNIDOWake/FeatureStores.swift
          grep -q 'ignidoAutoStopText' ios/IGNIDOWake/AlarmViews.swift
          grep -q 'Label("時計"' ios/IGNIDOWake/RootView.swift
          ! grep -q 'func armEscapeGuard(for item:' ios/IGNIDOWake/AlarmStore.swift
          ! grep -q 'store.markFinished()' ios/IGNIDOWake/ClockViews.swift
          test -d ios/IGNIDOWake/Assets.xcassets/AppIcon.appiconset
          test -s ios/IGNIDOWake/world_cities.tsv
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project IGNIDOWake.xcodeproj -scheme IGNIDOWake -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and inspect IPA
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '2.0.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '100'
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry IGNIDO-Wake-iOS-2.0.0-parity.ipa Payload
          unzip -t IGNIDO-Wake-iOS-2.0.0-parity.ipa
          shasum -a 256 IGNIDO-Wake-iOS-2.0.0-parity.ipa | tee IGNIDO-Wake-iOS-2.0.0-parity.sha256
      - name: Upload parity source
        uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-2.0.0-parity-source
          path: |
            ios/IGNIDOWake/
            ios/project.yml
            tools/patch_ios_v200_parity.py
            tools/patch_ios_v200_scope_fix.py
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-2.0.0-parity
          path: |
            ios/IGNIDO-Wake-iOS-2.0.0-parity.ipa
            ios/IGNIDO-Wake-iOS-2.0.0-parity.sha256
