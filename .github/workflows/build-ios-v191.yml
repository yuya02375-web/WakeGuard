name: Build iOS 1.9.1 IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_ios_v191_imported_alarm_sound_fix.py'
      - '.github/workflows/build-ios-v191.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Apply accumulated iOS fixes and 1.9.1 imported sound fix
        run: |
          python3 tools/patch_ios_v178.py
          python3 tools/patch_ios_v181_video_mission.py
          python3 tools/patch_ios_v182_fast_trilingual_search.py
          curl -fsSL --retry 4 --retry-delay 2 https://download.geonames.org/export/dump/cities15000.zip -o /tmp/cities15000.zip
          unzip -p /tmp/cities15000.zip cities15000.txt > /tmp/cities15000.txt
          test -s /tmp/cities15000.txt
          python3 tools/generate_ios_world_city_catalog.py
          python3 tools/patch_ios_v184_timer_parity.py
          python3 tools/patch_ios_v185_timer_inline_input.py
          python3 tools/patch_ios_v186_keyboard_dismiss.py
          python3 tools/patch_ios_v187_android_search_parity.py
          python3 tools/patch_ios_v188_online_google_search.py
          python3 tools/patch_ios_v188_swift6_compile_fix.py
          python3 tools/patch_ios_v190_alarm_sound_picker.py
          python3 tools/patch_ios_v191_imported_alarm_sound_fix.py
          test $(wc -c < ios/IGNIDOWake/world_cities.tsv) -gt 1000000
      - name: Validate imported MP3/custom alarm path
        run: |
          grep -q '<string>1.9.1</string>' ios/IGNIDOWake/Info.plist
          grep -q '<string>20</string>' ios/IGNIDOWake/Info.plist
          grep -q 'importAsAlarmSound(from sourceURL: URL)' ios/IGNIDOWake/AlarmSoundCatalog.swift
          grep -q 'customPrefix = "custom:"' ios/IGNIDOWake/AlarmSoundCatalog.swift
          grep -q 'Library.*Sounds' ios/IGNIDOWake/AlarmSoundCatalog.swift
          grep -q 'format.sampleRate \* 25.0' ios/IGNIDOWake/AlarmSoundCatalog.swift
          grep -q 'return .named(fileName)' ios/IGNIDOWake/AlarmSoundCatalog.swift
          grep -q 'installBundledSounds()' ios/IGNIDOWake/IGNIDOWakeApp.swift
          grep -q 'IgnidoAlarmSoundLibrary.importAsAlarmSound(from: url)' ios/IGNIDOWake/AlarmViews.swift
          grep -q 'draft.soundName = IgnidoAlarmSoundCatalog.customPrefix + alarmFile' ios/IGNIDOWake/AlarmViews.swift
          grep -q 'type.conforms(to: .audio)' ios/IGNIDOWake/AlarmViews.swift
          test $(grep -c 'IgnidoAlarmSoundCatalog.alertSound(for: item.soundName)' ios/IGNIDOWake/AlarmStore.swift) -ge 2
          for f in ignido_ember.wav ignido_blaze.wav ignido_pulse.wav ignido_siren.wav ignido_dawn.wav ignido_deep.wav; do
            test -s "ios/IGNIDOWake/$f"
          done
          grep -q 'Googleで確認' ios/IGNIDOWake/ClockViews.swift
          grep -q 'MultiTimerViewV186()' ios/IGNIDOWake/RootView.swift
      - name: Reconstruct accepted IGNIDO Wake icon
        run: |
          cd ios
          mkdir -p IGNIDOWake/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = Path('../tools/v172_icon_parts')
          names = ["part00.txt", "part01.txt", "part02a.txt", "part02b.txt", "part03.txt", "part04.txt", "part05.txt", "part06.txt"]
          expected_lengths = [3000, 3000, 1500, 1500, 3000, 3000, 3000, 1416]
          chunks=[]
          for name, expected in zip(names, expected_lengths):
              chunk=(parts/name).read_text().strip()
              if name == "part02a.txt" and len(chunk) == 1499:
                  chunk=chunk[:999]+"c"+chunk[999:]
              assert len(chunk)==expected, (name,len(chunk),expected)
              chunks.append(chunk)
          raw=base64.b64decode(''.join(chunks), validate=True)
          assert hashlib.sha256(raw).hexdigest()=="0bc991473cc8b15463d9722b9e58189cac417dede65c81638d29bce387b1a1cc"
          Path('/tmp/icon.webp').write_bytes(raw)
          PY
          brew install webp
          dwebp /tmp/icon.webp -o /tmp/icon.png
          python3 - <<'PY'
          import json, os, subprocess
          out='IGNIDOWake/Assets.xcassets/AppIcon.appiconset'
          specs=[('iphone','20x20','2x',40),('iphone','20x20','3x',60),('iphone','29x29','2x',58),('iphone','29x29','3x',87),('iphone','40x40','2x',80),('iphone','40x40','3x',120),('iphone','60x60','2x',120),('iphone','60x60','3x',180),('ios-marketing','1024x1024','1x',1024)]
          images=[]
          for idx,(idiom,size,scale,pix) in enumerate(specs):
              name=f'icon-{pix}-{idx}.png'
              subprocess.run(['sips','-z',str(pix),str(pix),'/tmp/icon.png','--out',f'{out}/{name}'],check=True,stdout=subprocess.DEVNULL)
              images.append({'idiom':idiom,'size':size,'scale':scale,'filename':name})
          with open(f'{out}/Contents.json','w') as f: json.dump({'images':images,'info':{'author':'xcode','version':1}},f)
          os.makedirs('IGNIDOWake/Assets.xcassets',exist_ok=True)
          with open('IGNIDOWake/Assets.xcassets/Contents.json','w') as f: json.dump({'info':{'author':'xcode','version':1}},f)
          PY
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project IGNIDOWake.xcodeproj -scheme IGNIDOWake -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA and validate bundled sounds
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '1.9.1'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '20'
          for f in ignido_ember.wav ignido_blaze.wav ignido_pulse.wav ignido_siren.wav ignido_dawn.wav ignido_deep.wav; do
            test -s "$APP/$f"
          done
          test -f "$APP/world_cities.tsv"
          test -d "$APP/ja.lproj"
          test -d "$APP/en.lproj"
          test -d "$APP/ko.lproj"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.ipa Payload
          unzip -t IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.ipa
          shasum -a 256 IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.ipa | tee IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.sha256
      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-1.9.1-patched-source
          path: |
            ios/IGNIDOWake/
            ios/project.yml
            tools/patch_ios_v178.py
            tools/patch_ios_v181_video_mission.py
            tools/patch_ios_v182_fast_trilingual_search.py
            tools/patch_ios_v184_timer_parity.py
            tools/patch_ios_v185_timer_inline_input.py
            tools/patch_ios_v186_keyboard_dismiss.py
            tools/patch_ios_v187_android_search_parity.py
            tools/patch_ios_v188_online_google_search.py
            tools/patch_ios_v188_swift6_compile_fix.py
            tools/patch_ios_v190_alarm_sound_picker.py
            tools/patch_ios_v191_imported_alarm_sound_fix.py
            tools/generate_ios_world_city_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix
          path: |
            ios/IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.ipa
            ios/IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.sha256
      - name: Publish prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-191-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ios/IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.ipa ios/IGNIDO-Wake-iOS-1.9.1-imported-alarm-sound-fix.sha256 --title "IGNIDO Wake iOS 1.9.1 imported alarm sound fix (${GITHUB_RUN_NUMBER})" --notes "Unsigned IPA for SideStore. Fixes imported MP3/M4A audio being ignored by AlarmKit: audio imports are transcoded to <=25-second PCM CAF and saved in Library/Sounds, then the per-alarm soundName is set to that generated file and AlarmKit schedules AlertSound.named. Bundled IGNIDO WAV sounds are also copied into Library/Sounds on launch to avoid custom-sound lookup fallback to the system default. Retains all prior search, timer, localization, icon and video-mission fixes." --prerelease
