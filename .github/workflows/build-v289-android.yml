name: Build IGNIDO Wake Android 2.8.9 Pixel RPG
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v289_pixel_dragon_android.py'
      - '.github/workflows/build-v289-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore Android 2.8.8 production source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/old288
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11520575978/zip -o /tmp/old288.zip
          unzip -q /tmp/old288.zip -d /tmp/old288
          test -s /tmp/old288/IGNIDO-Wake-Android-2.8.8-handcrafted-art-source.zip
          rm -rf WakeGuard/app
          unzip -q /tmp/old288/IGNIDO-Wake-Android-2.8.8-handcrafted-art-source.zip 'app/*' -d WakeGuard
          test -f WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakGrowth.java
      - name: Restore five artist-style sprite animations
        run: |
          mkdir -p WakeGuard/app/src/main/res/drawable-nodpi
          for stage in ember flame egg hatchling adult; do
            base64 -d "assets/dragon-growth-v289/ignido_stage_${stage}.webp.b64" > "WakeGuard/app/src/main/res/drawable-nodpi/ignido_stage_${stage}.webp"
          done
          (cd WakeGuard/app/src/main/res/drawable-nodpi &&
            printf '%s\n' \
              '7f3524c0ad3ffd05f498f59183cde35be676414c5e59c46dd86b0f13c310fae8  ignido_stage_ember.webp' \
              '1c764235d371b45a64bfd4c22ea074cbec6745e2077f4165e3141552e7b44f4c  ignido_stage_flame.webp' \
              '4274437be80aabc6195d856d66e01d5a674667e207ac93ea3ec5910b67f3b337  ignido_stage_egg.webp' \
              'fd50b683f6b1f22e9330fba414fd520c399c83a68f84935363b228a7abe5a683  ignido_stage_hatchling.webp' \
              '30f0bc124fb764f0afb4b50e920f87164326c70c6cc231ca55614b8252fb5a7d  ignido_stage_adult.webp' | sha256sum -c -)
      - name: Validate real animation frames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('WakeGuard/app/src/main/res/drawable-nodpi')
          for stage,frames in {'ember':8,'flame':8,'egg':6,'hatchling':5,'adult':5}.items():
              data=(base/f'ignido_stage_{stage}.webp').read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              assert data.count(b'ANIM')==1
              assert data.count(b'ANMF')==frames,(stage,data.count(b'ANMF'))
              print(stage,frames,'verified')
          PY
      - name: Apply 2.8.9 pixel RPG evolution
        run: python3 tools/patch_v289_pixel_dragon_android.py
      - name: Check life stages preserve day-three ember
        run: |
          grep -q 'versionCode = 189' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.8.9"' WakeGuard/app/build.gradle.kts
          grep -q 'visibleLevel<4L ? 0' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'visibleLevel<80L ? 3' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'StreakGrowth.appearanceLevel(permanentLevel,currentStreak)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          ! grep -q 'android.opengl' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          ! grep -q 'com.google.android.filament' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          ! test -e WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v286.webp
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Emulator smoke-test streak screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r WakeGuard/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb root
            adb wait-for-device
            adb shell am start -W -n jp.wakeguard.alarm/.MainActivity
            sleep 3
            adb shell am start -W -n jp.wakeguard.alarm/.StatsActivity
            sleep 10
            adb shell pidof jp.wakeguard.alarm
            adb shell dumpsys activity activities | grep -q 'jp.wakeguard.alarm/.StatsActivity'
            adb logcat -d -v brief > /tmp/streak-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: jp\.wakeguard\.alarm.*died|Fatal signal.*jp\.wakeguard\.alarm' /tmp/streak-logcat.txt
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/wakeguard-release.p12" --ks-type PKCS12 --ks-key-alias "$WAKEGUARD_KEY_ALIAS" --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD --key-pass env:WAKEGUARD_KEY_PASSWORD --v2-signing-enabled true --v3-signing-enabled true --out IGNIDO-Wake-Android-2.8.9-pixel-rpg.apk WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.8.9-pixel-rpg.apk
          sha256sum IGNIDO-Wake-Android-2.8.9-pixel-rpg.apk | tee IGNIDO-Wake-Android-2.8.9-pixel-rpg.sha256
      - name: Package reproducible source and provenance
        run: |
          cp tools/patch_v289_pixel_dragon_android.py WakeGuard/
          cp tools/make_pixel_art_v289.py WakeGuard/
          cp -R assets/dragon-growth-v289 WakeGuard/
          mkdir -p WakeGuard/credits
          printf '%s\n' 'Original pixel dragon frames by kotnaszynce, licensed CC0.' 'https://opengameart.org/content/dragon-9' 'Stages 1-3 drawn as project-original pixel art; hatchling/adult adapted from original.' > WakeGuard/credits/PIXEL_ART_LICENSE.txt
          rm -rf WakeGuard/app/build WakeGuard/app/.gradle
          (cd WakeGuard && zip -qr ../IGNIDO-Wake-Android-2.8.9-pixel-rpg-source.zip app patch_v289_pixel_dragon_android.py make_pixel_art_v289.py dragon-growth-v289 credits)
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.9-pixel-rpg
          path: |
            IGNIDO-Wake-Android-2.8.9-pixel-rpg.apk
            IGNIDO-Wake-Android-2.8.9-pixel-rpg.sha256
            IGNIDO-Wake-Android-2.8.9-pixel-rpg-source.zip
