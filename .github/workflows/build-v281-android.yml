name: Build IGNIDO Wake Android 2.8.1 Streak Crash Fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v281_streak_crash_android.py'
      - '.github/workflows/build-v281-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.8.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a280 && mkdir -p /tmp/a280
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11326057814/zip \
            -o /tmp/a280.zip
          unzip -q /tmp/a280.zip -d /tmp/a280
          test -f /tmp/a280/WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          rm -rf WakeGuard/app
          cp -R /tmp/a280/WakeGuard/app WakeGuard/app
      - name: Apply 2.8.1 crash fix
        run: python3 tools/patch_v281_streak_crash_android.py
      - name: Build crash-safe dragon mesh
        run: |
          python3 -m pip install --disable-pip-version-check --quiet numpy trimesh
          python3 tools/build_dragon_mesh_v281.py
          test -s WakeGuard/app/src/main/assets/dragon_mesh.bin
          test $(stat -c%s WakeGuard/app/src/main/assets/dragon_mesh.bin) -gt 1000000
      - name: Validate
        run: |
          grep -q 'versionCode = 181' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.8.1"' WakeGuard/app/build.gradle.kts
          ! grep -q 'filament-android' WakeGuard/app/build.gradle.kts
          grep -q 'GLSurfaceView.Renderer' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'dragon_mesh.bin' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'class IgnidoBackupAgent' WakeGuard/app/src/main/java/jp/wakeguard/alarm/IgnidoBackupAgent.java
          grep -q 'すべて取消' WakeGuard/app/src/main/java/jp/wakeguard/alarm/MainActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.1-streak-crash-fix-source
          path: |
            WakeGuard/app/
            tools/patch_v281_streak_crash_android.py
            tools/build_dragon_mesh_v281.py
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Emulator smoke test streak screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r WakeGuard/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n jp.wakeguard.alarm/.StatsActivity
            sleep 8
            adb shell pidof jp.wakeguard.alarm
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|Process: jp\.wakeguard\.alarm.*died|Fatal signal.*jp\.wakeguard\.alarm'; then
              echo "Streak screen crashed"
              exit 1
            fi
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/wakeguard-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$WAKEGUARD_KEY_ALIAS" \
            --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD \
            --key-pass env:WAKEGUARD_KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out IGNIDO-Wake-Android-2.8.1-streak-crash-fix.apk \
            WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.8.1-streak-crash-fix.apk
          sha256sum IGNIDO-Wake-Android-2.8.1-streak-crash-fix.apk | tee IGNIDO-Wake-Android-2.8.1-streak-crash-fix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.1-streak-crash-fix
          path: |
            IGNIDO-Wake-Android-2.8.1-streak-crash-fix.apk
            IGNIDO-Wake-Android-2.8.1-streak-crash-fix.sha256
