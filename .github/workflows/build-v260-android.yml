name: Build IGNIDO Wake Android 2.6.0 Realistic Dragon
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v260_realistic_dragon_android.py'
      - '.github/workflows/build-v260-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.5.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a250 && mkdir -p /tmp/a250
          gh run download 36548303323 -n IGNIDO-Wake-Android-2.5.0-visible-dragon-source -D /tmp/a250
          test -f /tmp/a250/WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          rm -rf WakeGuard/app
          cp -R /tmp/a250/WakeGuard/app WakeGuard/app
      - name: Apply realistic dragon renderer
        run: python3 tools/patch_v260_realistic_dragon_android.py
      - name: Validate renderer and preserved features
        run: |
          grep -q 'versionCode = 160' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.6.0"' WakeGuard/app/build.gradle.kts
          grep -q 'float bodyAt(vec2 uv)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'float wingAt(vec2 uv)' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'DragonScale' /dev/null || true
          grep -q 'scaleRim' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'drawDragonHotMask' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'KEY_SW_LAP_WALLS' WakeGuard/app/src/main/java/jp/wakeguard/alarm/ClockActivity.java
          grep -q 'showImportFolderPicker' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.6.0-realistic-dragon-source
          path: WakeGuard/app/
      - name: Enable AndroidX
        run: sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          STORE_PASS: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/wakeguard-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --v2-signing-enabled true --v3-signing-enabled true --out IGNIDO-Wake-Android-2.6.0-realistic-dragon.apk WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.6.0-realistic-dragon.apk
          sha256sum IGNIDO-Wake-Android-2.6.0-realistic-dragon.apk | tee IGNIDO-Wake-Android-2.6.0-realistic-dragon.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.6.0-realistic-dragon
          path: |
            IGNIDO-Wake-Android-2.6.0-realistic-dragon.apk
            IGNIDO-Wake-Android-2.6.0-realistic-dragon.sha256
