name: Build WakeGuard Stable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct source archive
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -t WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip

      - name: Apply WakeGuard v0.9.0 multi-mission AI UI
        run: |
          python3 tools/patch_v090.py
          grep -n "MISSION ENGINE\|歩数.*計算.*連打.*コード入力.*ランダム" WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmEditorActivity.java
          grep -n "missionType\|missionCount" WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmStore.java
          grep -n "WAKEGUARD // CORE\|NEXT WAKE EVENT" WakeGuard/app/src/main/java/jp/wakeguard/alarm/MainActivity.java
          grep -n "WAKE PROTOCOL // ACTIVE\|submitMath\|submitCode" WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmActivity.java
          grep -n "versionName\|versionCode" WakeGuard/app/build.gradle.kts

      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: WakeGuard-v0.9.0-patched-source
          path: |
            WakeGuard/app/src/main/java/jp/wakeguard/alarm/*.java
            WakeGuard/app/src/main/AndroidManifest.xml
            WakeGuard/app/build.gradle.kts

      - name: Validate stable signing secrets
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          test -n "$WAKEGUARD_KEYSTORE_B64"
          test -n "$WAKEGUARD_KEYSTORE_PASSWORD"
          test -n "$WAKEGUARD_KEY_ALIAS"
          test -n "$WAKEGUARD_KEY_PASSWORD"

      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
          chmod 600 "$RUNNER_TEMP/wakeguard-release.p12"

      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace

      - name: Sign APK with stable key
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/wakeguard-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$WAKEGUARD_KEY_ALIAS" \
            --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD \
            --key-pass env:WAKEGUARD_KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out WakeGuard-v0.9.0-stable.apk \
            WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs WakeGuard-v0.9.0-stable.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WakeGuard-v0.9.0-stable-apk
          path: WakeGuard-v0.9.0-stable.apk
