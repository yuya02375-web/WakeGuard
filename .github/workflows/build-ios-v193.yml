name: Build iOS 1.9.3 Alarm Core IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_ios_v193_alarm_core_rebuild.py'
      - '.github/workflows/build-ios-v193.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Apply accumulated iOS fixes through 1.9.3
        run: |
          python3 tools/patch_ios_v178.py
          python3 tools/patch_ios_v181_video_mission.py
          python3 tools/patch_ios_v182_fast_trilingual_search.py
          curl -fsSL --retry 4 --retry-delay 2 https://download.geonames.org/export/dump/cities15000.zip -o /tmp/cities15000.zip
          unzip -p /tmp/cities15000.zip cities15000.txt > /tmp/cities15000.txt
          test -s /tmp/cities15000.txt
          python3 tools/generate_ios_world_city_catalog.py
          python3 tools/patch_ios_v184_timer_parity.py
          python3 tools/patch_ios_v185_timer_inline_input.py
          python3 tools/patch_ios_v186_keyboard_dismiss.py
          python3 tools/patch_ios_v187_android_search_parity.py
          python3 tools/patch_ios_v188_online_google_search.py
          python3 tools/patch_ios_v188_swift6_compile_fix.py
          python3 tools/patch_ios_v190_alarm_sound_picker.py
          python3 tools/patch_ios_v191_prepare_importer.py
          python3 tools/patch_ios_v191_imported_alarm_sound_fix.py
          python3 tools/patch_ios_v192_stability.py
          python3 tools/patch_ios_v192_compile_fix.py
          python3 tools/patch_ios_v193_alarm_core_rebuild.py
          test $(wc -c < ios/IGNIDOWake/world_cities.tsv) -gt 1000000
      - name: Validate 1.9.3 alarm invariants
        run: |
          grep -q '<string>1.9.3</string>' ios/IGNIDOWake/Info.plist
          grep -q '<string>22</string>' ios/IGNIDOWake/Info.plist
          grep -q 'NSAlarmKitUsageDescription' ios/IGNIDOWake/Info.plist
          grep -q 'NSMotionUsageDescription' ios/IGNIDOWake/Info.plist
          grep -q 'repeats: recurrence' ios/IGNIDOWake/AlarmStore.swift
          grep -q 'item.weekdays.isEmpty ? .never' ios/IGNIDOWake/AlarmStore.swift
          ! grep -q '.fixed(fire)' ios/IGNIDOWake/AlarmStore.swift
          grep -q 'pendingAlarmRequests.v3' ios/IGNIDOWake/AlarmIntents.swift
          grep -q 'wallClockIsNear' ios/IGNIDOWake/AlarmIntents.swift
          grep -q 'weekdaysMask' ios/IGNIDOWake/AlarmIntents.swift
          grep -q 'alerting && alarmStore.isWithinExpectedAlertWindow(alarm)' ios/IGNIDOWake/RootView.swift
          ! grep -q 'valid || alarmStore.isAlarmDueNow' ios/IGNIDOWake/RootView.swift
          grep -q 'performV193MigrationIfNeeded' ios/IGNIDOWake/AlarmStore.swift
          grep -q 'private let livePedometer = CMPedometer()' ios/IGNIDOWake/MissionView.swift
          grep -q 'private let historyPedometer = CMPedometer()' ios/IGNIDOWake/MissionView.swift
          grep -q 'queryPedometerData' ios/IGNIDOWake/MissionView.swift
          grep -q 'startUpdates(from: startDate)' ios/IGNIDOWake/MissionView.swift
          python3 - <<'PY'
          from pathlib import Path
          m=Path('ios/IGNIDOWake/MissionView.swift').read_text()
          head=m.split('@MainActor\nfinal class StepMissionCounter',1)[0]
          assert 'AlarmRuntime.preparePlaybackSession()' not in head
          a=Path('ios/IGNIDOWake/AlarmViews.swift').read_text()
          block=a[a.index('.fileImporter'):a.index('.onDisappear',a.index('.fileImporter'))]
          assert 'draft.mediaFileName = nil' in block
          assert 'draft.soundName = IgnidoAlarmSoundCatalog.customPrefix + alarmFile' in block
          PY
          for f in ignido_ember.wav ignido_blaze.wav ignido_pulse.wav ignido_siren.wav ignido_dawn.wav ignido_deep.wav; do test -s "ios/IGNIDOWake/$f"; done
          test -s ios/IGNIDOWake/ja.lproj/Localizable.strings
          test -s ios/IGNIDOWake/en.lproj/Localizable.strings
          test -s ios/IGNIDOWake/ko.lproj/Localizable.strings
      - name: Reconstruct accepted icon
        run: |
          cd ios
          mkdir -p IGNIDOWake/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          parts=Path('../tools/v172_icon_parts')
          names=['part00.txt','part01.txt','part02a.txt','part02b.txt','part03.txt','part04.txt','part05.txt','part06.txt']
          lens=[3000,3000,1500,1500,3000,3000,3000,1416]
          chunks=[]
          for name,n in zip(names,lens):
              c=(parts/name).read_text().strip()
              if name=='part02a.txt' and len(c)==1499: c=c[:999]+'c'+c[999:]
              assert len(c)==n
              chunks.append(c)
          raw=base64.b64decode(''.join(chunks),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='0bc991473cc8b15463d9722b9e58189cac417dede65c81638d29bce387b1a1cc'
          Path('/tmp/icon.webp').write_bytes(raw)
          PY
          brew install webp
          dwebp /tmp/icon.webp -o /tmp/icon.png
          python3 - <<'PY'
          import json,os,subprocess
          out='IGNIDOWake/Assets.xcassets/AppIcon.appiconset'
          specs=[('iphone','20x20','2x',40),('iphone','20x20','3x',60),('iphone','29x29','2x',58),('iphone','29x29','3x',87),('iphone','40x40','2x',80),('iphone','40x40','3x',120),('iphone','60x60','2x',120),('iphone','60x60','3x',180),('ios-marketing','1024x1024','1x',1024)]
          imgs=[]
          for i,(idiom,size,scale,pix) in enumerate(specs):
              name=f'icon-{pix}-{i}.png'; subprocess.run(['sips','-z',str(pix),str(pix),'/tmp/icon.png','--out',f'{out}/{name}'],check=True,stdout=subprocess.DEVNULL); imgs.append({'idiom':idiom,'size':size,'scale':scale,'filename':name})
          with open(f'{out}/Contents.json','w') as f: json.dump({'images':imgs,'info':{'author':'xcode','version':1}},f)
          os.makedirs('IGNIDOWake/Assets.xcassets',exist_ok=True)
          with open('IGNIDOWake/Assets.xcassets/Contents.json','w') as f: json.dump({'info':{'author':'xcode','version':1}},f)
          PY
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project IGNIDOWake.xcodeproj -scheme IGNIDOWake -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and inspect IPA
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '1.9.3'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '22'
          /usr/libexec/PlistBuddy -c 'Print :NSAlarmKitUsageDescription' "$APP/Info.plist" | grep -q .
          /usr/libexec/PlistBuddy -c 'Print :NSMotionUsageDescription' "$APP/Info.plist" | grep -q .
          for f in ignido_ember.wav ignido_blaze.wav ignido_pulse.wav ignido_siren.wav ignido_dawn.wav ignido_deep.wav; do test -s "$APP/$f"; done
          test -f "$APP/world_cities.tsv"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.ipa Payload
          unzip -t IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.ipa
          shasum -a 256 IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.ipa | tee IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.sha256
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-1.9.3-patched-source
          path: |
            ios/IGNIDOWake/
            ios/project.yml
            tools/patch_ios_v193_alarm_core_rebuild.py
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild
          path: |
            ios/IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.ipa
            ios/IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.sha256
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-193-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ios/IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.ipa ios/IGNIDO-Wake-iOS-1.9.3-alarm-core-rebuild.sha256 --title "IGNIDO Wake iOS 1.9.3 alarm core rebuild (${GITHUB_RUN_NUMBER})" --notes "Rebuilds the iOS alarm core after real-device failures in 1.9.2: Apple-style relative one-shot scheduling, one-time cleanup of old 1.9.2 AlarmKit registrations, strict current-alert + wall-clock validation to prevent old 07:00 alarms opening later, no foreground auto-reschedule, imported audio stays AlarmKit-owned instead of AVPlayer-owned, generic missions no longer seize AVAudioSession, and step mission uses separate live and historical CMPedometer paths with permission recovery." --prerelease
