name: Build IGNIDO Wake Android 2.8.6 Animated Dragon
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v286_animated_dragon_android.py'
      - '.github/workflows/build-v286-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore Android 2.8.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a284 && mkdir -p /tmp/a284
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11491517732/zip -o /tmp/a284.zip
          unzip -q /tmp/a284.zip -d /tmp/a284
          rm -rf WakeGuard/app
          cp -R /tmp/a284/WakeGuard/app WakeGuard/app
      - name: Apply 2.8.5 growth integration
        run: python3 tools/patch_v285_static_dragon_android.py
      - name: Install animated dragon frames
        run: |
          mkdir -p WakeGuard/app/src/main/res/drawable-nodpi
          curl -L --fail --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-62a8-8206-bd93-e83c71cac4d1/raw?se=2026-10-07T23%3A49%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=51c031b0-e499-5383-abd0-d8b3e3314414&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T21%3A11%3A41Z&ske=2026-10-08T21%3A11%3A41Z&sks=b&skv=2026-02-06&sig=VYu6qtbuXVHX5Fq0weK1yx4xYsyzC46Rc/Ib2GEjcSA%3D' -o WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v286.webp
          test $(stat -c%s WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v286.webp) -gt 1000000
          identify WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v286.webp | grep -q '\[11\]'
      - name: Apply 2.8.6 animated dragon patch
        run: python3 tools/patch_v286_animated_dragon_android.py
      - name: Validate real frame animation
        run: |
          grep -q 'versionCode = 186' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.8.6"' WakeGuard/app/build.gradle.kts
          grep -q 'AnimatedImageDrawable' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'ImageDecoder' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          ! grep -q 'ValueAnimator' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          ! grep -q 'android.opengl' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Emulator smoke test streak screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r WakeGuard/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb root
            adb wait-for-device
            adb shell am start -W -n jp.wakeguard.alarm/.MainActivity
            sleep 3
            adb shell am start -W -n jp.wakeguard.alarm/.StatsActivity
            sleep 10
            adb shell pidof jp.wakeguard.alarm
            adb shell dumpsys activity activities | grep -q 'jp.wakeguard.alarm/.StatsActivity'
            adb logcat -d -v brief > /tmp/streak-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: jp\.wakeguard\.alarm.*died|Fatal signal.*jp\.wakeguard\.alarm' /tmp/streak-logcat.txt
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/wakeguard-release.p12" --ks-type PKCS12 --ks-key-alias "$WAKEGUARD_KEY_ALIAS" --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD --key-pass env:WAKEGUARD_KEY_PASSWORD --v2-signing-enabled true --v3-signing-enabled true --out IGNIDO-Wake-Android-2.8.6-animated-dragon.apk WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.8.6-animated-dragon.apk
          sha256sum IGNIDO-Wake-Android-2.8.6-animated-dragon.apk | tee IGNIDO-Wake-Android-2.8.6-animated-dragon.sha256
      - name: Package source
        run: |
          cp tools/patch_v286_animated_dragon_android.py WakeGuard/
          (cd WakeGuard && zip -qr ../IGNIDO-Wake-Android-2.8.6-animated-dragon-source.zip app patch_v286_animated_dragon_android.py)
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.6-animated-dragon
          path: |
            IGNIDO-Wake-Android-2.8.6-animated-dragon.apk
            IGNIDO-Wake-Android-2.8.6-animated-dragon.sha256
            IGNIDO-Wake-Android-2.8.6-animated-dragon-source.zip
