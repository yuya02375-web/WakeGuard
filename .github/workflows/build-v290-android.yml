name: Build IGNIDO Wake Android 2.9.0 Alarm Transition Fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v290_alarm_transition.py'
      - '.github/workflows/build-v290-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore production Android 2.8.9 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a289
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11521475325/zip -o /tmp/a289.zip
          unzip -q /tmp/a289.zip -d /tmp/a289
          test -s /tmp/a289/IGNIDO-Wake-Android-2.8.9-pixel-rpg-source.zip
          rm -rf WakeGuard/app
          unzip -q /tmp/a289/IGNIDO-Wake-Android-2.8.9-pixel-rpg-source.zip 'app/*' -d WakeGuard
          test -f WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmActivity.java
      - name: Apply alarm screen re-entry fix
        run: python3 tools/patch_v290_alarm_transition.py
      - name: Verify targeted alarm-only changes
        run: |
          grep -q 'versionCode = 190' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.9.0"' WakeGuard/app/build.gradle.kts
          grep -q 'Reentered scheduled UI' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmActivity.java
          grep -q 'if (visible) return;' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmActivity.java
          grep -q 'Service action=' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmService.java
          grep -q 'visibleLevel<4L ? 0' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Emulator test alarm UI re-entry and no disappearance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r WakeGuard/app/build/outputs/apk/debug/app-debug.apk
            adb root
            adb wait-for-device
            adb logcat -c
            adb shell am start -W -n jp.wakeguard.alarm/.MainActivity
            sleep 2
            adb shell am start-foreground-service -n jp.wakeguard.alarm/.AlarmService -a jp.wakeguard.alarm.FIRE_TEST --el alarmId 1
            sleep 5
            adb shell pidof jp.wakeguard.alarm
            adb shell am start -W -n jp.wakeguard.alarm/.AlarmActivity
            sleep 2
            adb shell dumpsys activity activities | grep -q 'jp.wakeguard.alarm/.AlarmActivity'
            adb shell am start -W -f 0x34000000 -n jp.wakeguard.alarm/.AlarmActivity -a jp.wakeguard.alarm.UI_SCHEDULED_FIRE --el alarmId 1 --el epochDay 0 --el expectedAt 0
            sleep 5
            adb shell pidof jp.wakeguard.alarm
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -q 'jp.wakeguard.alarm/.AlarmActivity'
            adb logcat -d -v brief > /tmp/v290-alarm-logcat.txt
            grep -q 'Reentered scheduled UI' /tmp/v290-alarm-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: jp\\.wakeguard\\.alarm.*died|Fatal signal.*jp\\.wakeguard\\.alarm' /tmp/v290-alarm-logcat.txt
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/wakeguard-release.p12" --ks-type PKCS12 --ks-key-alias "$WAKEGUARD_KEY_ALIAS" --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD --key-pass env:WAKEGUARD_KEY_PASSWORD --v2-signing-enabled true --v3-signing-enabled true --out IGNIDO-Wake-Android-2.9.0-alarm-transition.apk WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.9.0-alarm-transition.apk
          sha256sum IGNIDO-Wake-Android-2.9.0-alarm-transition.apk | tee IGNIDO-Wake-Android-2.9.0-alarm-transition.sha256
      - name: Package source including regression fix
        run: |
          cp tools/patch_v290_alarm_transition.py WakeGuard/
          cp -R assets/dragon-growth-v289 WakeGuard/
          rm -rf WakeGuard/app/build WakeGuard/app/.gradle
          (cd WakeGuard && zip -qr ../IGNIDO-Wake-Android-2.9.0-alarm-transition-source.zip app patch_v290_alarm_transition.py dragon-growth-v289)
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.9.0-alarm-transition
          path: |
            IGNIDO-Wake-Android-2.9.0-alarm-transition.apk
            IGNIDO-Wake-Android-2.9.0-alarm-transition.sha256
            IGNIDO-Wake-Android-2.9.0-alarm-transition-source.zip
