name: Build IGNIDO Wake Android 2.8.4 Hero Dragon
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v284_prerendered_dragon_android.py'
      - '.github/workflows/build-v284-android.yml'
      - 'assets/dragon-v284/**'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore tested Android 2.8.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a283 && mkdir -p /tmp/a283
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11487886438/zip \
            -o /tmp/a283.zip
          unzip -q /tmp/a283.zip -d /tmp/a283
          test -f /tmp/a283/WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          rm -rf WakeGuard/app
          cp -R /tmp/a283/WakeGuard/app WakeGuard/app
      - name: Reassemble high-detail dragon asset
        run: |
          mkdir -p WakeGuard/app/src/main/res/drawable-nodpi
          cat assets/dragon-v284/part*.b64 | tr -d '\r\n' | base64 --decode > WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v284.webp
          file WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v284.webp
          test $(stat -c%s WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v284.webp) -gt 80000
          echo "7faa2041db72afe2f4b6d7767977c36614aaf07f0f957d6f598d2f6457a5ae19  WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v284.webp" | sha256sum -c -
      - name: Apply 2.8.4 hero dragon patch
        run: python3 tools/patch_v284_prerendered_dragon_android.py
      - name: Validate
        run: |
          grep -q 'versionCode = 184' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.8.4"' WakeGuard/app/build.gradle.kts
          grep -q 'ignido_dragon_v284' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          grep -q 'ImageView' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          ! grep -q 'android.opengl' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          ! grep -q 'com.google.android.filament' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
          test -s WakeGuard/app/src/main/res/drawable-nodpi/ignido_dragon_v284.webp
          grep -q 'すべて取消' WakeGuard/app/src/main/java/jp/wakeguard/alarm/MainActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.4-hero-dragon-source
          path: |
            WakeGuard/app/
            tools/patch_v284_prerendered_dragon_android.py
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
      - name: Emulator smoke test streak screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r WakeGuard/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant jp.wakeguard.alarm android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant jp.wakeguard.alarm android.permission.ACTIVITY_RECOGNITION || true
            adb logcat -c
            adb root
            adb wait-for-device
            adb shell am start -W -n jp.wakeguard.alarm/.MainActivity
            sleep 3
            adb shell am start -W -n jp.wakeguard.alarm/.StatsActivity
            sleep 8
            adb shell pidof jp.wakeguard.alarm
            adb shell dumpsys activity activities | grep -q 'jp.wakeguard.alarm/.StatsActivity'
            adb logcat -d -v brief > /tmp/streak-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: jp\.wakeguard\.alarm.*died|Fatal signal.*jp\.wakeguard\.alarm' /tmp/streak-logcat.txt
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/wakeguard-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$WAKEGUARD_KEY_ALIAS" \
            --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD \
            --key-pass env:WAKEGUARD_KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out IGNIDO-Wake-Android-2.8.4-hero-dragon.apk \
            WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.8.4-hero-dragon.apk
          sha256sum IGNIDO-Wake-Android-2.8.4-hero-dragon.apk | tee IGNIDO-Wake-Android-2.8.4-hero-dragon.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.4-hero-dragon
          path: |
            IGNIDO-Wake-Android-2.8.4-hero-dragon.apk
            IGNIDO-Wake-Android-2.8.4-hero-dragon.sha256
