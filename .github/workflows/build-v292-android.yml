name: Build IGNIDO Wake Android 2.9.2 Natural UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v292_natural_ui.py'
      - 'assets/material-icons/v292/icons.json'
      - '.github/workflows/build-v292-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore project and exact 2.9.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > /tmp/WakeGuard-source.zip
          unzip -q /tmp/WakeGuard-source.zip
          mkdir -p /tmp/base291
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/13031567719/zip -o /tmp/base291.zip
          unzip -q /tmp/base291.zip -d /tmp/base291
          test -s /tmp/base291/IGNIDO-Wake-Android-2.9.1-ui-redesign-source.zip
          rm -rf WakeGuard/app
          unzip -q /tmp/base291/IGNIDO-Wake-Android-2.9.1-ui-redesign-source.zip 'app/*' -d WakeGuard
          test -f WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakCompanionView.java
      - name: Install official Google Material icon vectors
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          icons=json.loads(Path('assets/material-icons/v292/icons.json').read_text())
          assert len(icons)==15
          d=Path('WakeGuard/app/src/main/res/drawable')
          d.mkdir(parents=True,exist_ok=True)
          for name,xml in icons.items():
              ET.fromstring(xml)
              (d/('ic_v292_'+name+'.xml')).write_text(xml)
              print(name)
          PY
      - name: Apply v2.9.2 UI refinements
        run: |
          cd WakeGuard
          python3 ../tools/patch_v292_natural_ui.py
      - name: Verify natural icon and alarm invariants
        run: |
          grep -q 'versionCode = 192' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.9.2"' WakeGuard/app/build.gradle.kts
          grep -q 'updateBottomTab' WakeGuard/app/src/main/java/jp/wakeguard/alarm/Ui.java
          grep -q 'ImageButton back=Ui.iconButton' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmEditorActivity.java
          grep -q 'appearanceLevel' WakeGuard/app/src/main/java/jp/wakeguard/alarm/StreakGrowth.java
          grep -q 'Reentered scheduled UI' WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmActivity.java
          test -f WakeGuard/app/src/main/res/drawable/ic_v292_nav_streak_outline.xml
          test -f WakeGuard/app/src/main/res/drawable/ic_v292_action_settings.xml
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Make UI screenshot directory
        run: mkdir -p ui-v292
      - name: Capture six Japanese UI screens and alarm regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r WakeGuard/app/build/outputs/apk/debug/app-debug.apk
            adb root
            adb wait-for-device
            adb shell pm grant jp.wakeguard.alarm android.permission.POST_NOTIFICATIONS
            adb shell pm grant jp.wakeguard.alarm android.permission.ACTIVITY_RECOGNITION
            adb shell cmd locale set-app-locales jp.wakeguard.alarm --locales ja-JP
            adb logcat -c
            adb shell am start -W -n jp.wakeguard.alarm/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/alarms.png
            adb pull /sdcard/alarms.png ui-v292/alarms.png
            adb shell am force-stop jp.wakeguard.alarm
            adb shell am start -W -n jp.wakeguard.alarm/.ClockActivity --es mode world
            sleep 2
            adb shell screencap -p /sdcard/world.png
            adb pull /sdcard/world.png ui-v292/world.png
            adb shell am force-stop jp.wakeguard.alarm
            adb shell am start -W -n jp.wakeguard.alarm/.ClockActivity --es mode timer
            sleep 2
            adb shell screencap -p /sdcard/timer.png
            adb pull /sdcard/timer.png ui-v292/timer.png
            adb shell am force-stop jp.wakeguard.alarm
            adb shell am start -W -n jp.wakeguard.alarm/.ClockActivity --es mode stopwatch
            sleep 2
            adb shell screencap -p /sdcard/stopwatch.png
            adb pull /sdcard/stopwatch.png ui-v292/stopwatch.png
            adb shell am start -W -n jp.wakeguard.alarm/.StatsActivity
            sleep 3
            adb shell screencap -p /sdcard/streak.png
            adb pull /sdcard/streak.png ui-v292/streak.png
            adb shell am start -W -n jp.wakeguard.alarm/.AlarmEditorActivity --el alarmId -1
            sleep 2
            adb shell screencap -p /sdcard/editor.png
            adb pull /sdcard/editor.png ui-v292/editor.png
            adb shell am start-foreground-service -n jp.wakeguard.alarm/.AlarmService -a jp.wakeguard.alarm.FIRE_TEST --el alarmId 1
            sleep 4
            adb shell am start -W -n jp.wakeguard.alarm/.AlarmActivity
            sleep 2
            adb shell am start -W -f 0x34000000 -n jp.wakeguard.alarm/.AlarmActivity -a jp.wakeguard.alarm.UI_SCHEDULED_FIRE --el alarmId 1 --el epochDay 0 --el expectedAt 0
            sleep 4
            adb shell pidof jp.wakeguard.alarm
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -q 'jp.wakeguard.alarm/.AlarmActivity'
            adb logcat -d -v brief > ui-v292/alarm-logcat.txt
            grep -q 'Reentered scheduled UI' ui-v292/alarm-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: jp\\.wakeguard\\.alarm.*died|Fatal signal.*jp\\.wakeguard\\.alarm' ui-v292/alarm-logcat.txt
      - name: Package screenshots
        run: |
          test $(find ui-v292 -name '*.png' | wc -l) -eq 6
          (cd ui-v292 && zip -q ../IGNIDO-Wake-Android-2.9.2-screen-review.zip *.png)
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.9.2-screens
          path: IGNIDO-Wake-Android-2.9.2-screen-review.zip
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/wakeguard-release.p12" --ks-type PKCS12 --ks-key-alias "$WAKEGUARD_KEY_ALIAS" --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD --key-pass env:WAKEGUARD_KEY_PASSWORD --v2-signing-enabled true --v3-signing-enabled true --out IGNIDO-Wake-Android-2.9.2-natural-UI.apk WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.9.2-natural-UI.apk
          sha256sum IGNIDO-Wake-Android-2.9.2-natural-UI.apk > IGNIDO-Wake-Android-2.9.2-natural-UI.sha256
      - name: Package reproducible source
        run: |
          cp tools/patch_v292_natural_ui.py WakeGuard/
          cp -R assets/material-icons/v292 WakeGuard/
          mkdir -p WakeGuard/credits
          printf '%s\n' 'Material Icons by Google, Apache License 2.0' 'https://github.com/google/material-design-icons' > WakeGuard/credits/MATERIAL_ICONS_LICENSE.txt
          rm -rf WakeGuard/app/build WakeGuard/app/.gradle
          (cd WakeGuard && zip -qr ../IGNIDO-Wake-Android-2.9.2-natural-UI-source.zip app patch_v292_natural_ui.py v292 credits)
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.9.2-natural-UI
          path: |
            IGNIDO-Wake-Android-2.9.2-natural-UI.apk
            IGNIDO-Wake-Android-2.9.2-natural-UI.sha256
            IGNIDO-Wake-Android-2.9.2-natural-UI-source.zip
