name: Build WakeGuard APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct source archive
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -t WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Apply WakeGuard v0.5.2 fixes
        run: |
          python3 tools/patch_v052.py
          grep -n "ACTIVITY_RECOGNITION" WakeGuard/app/src/main/java/jp/wakeguard/alarm/AlarmService.java
          grep -n "persistUiState\|wakeguard_alarm_audio" WakeGuard/app/src/main/java/jp/wakeguard/alarm/MainActivity.java
          grep -n "versionName\|versionCode" WakeGuard/app/build.gradle.kts
      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: WakeGuard-v0.5.2-patched-source
          path: |
            WakeGuard/app/src/main/java/jp/wakeguard/alarm/*.java
            WakeGuard/app/src/main/AndroidManifest.xml
            WakeGuard/app/build.gradle.kts
      - name: Build debug APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WakeGuard-v0.5.2-debug-apk
          path: WakeGuard/app/build/outputs/apk/debug/app-debug.apk
