name: Build IGNIDO Wake iOS 2.4.2 Big Flame UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_ios_v242_big_flame_ui.py'
      - '.github/workflows/build-ios-v242.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - run: brew install xcodegen
      - name: Restore exact iOS 2.4.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/i240 && mkdir -p /tmp/i240
          gh run download 36513095107 -n IGNIDO-Wake-iOS-2.4.0-streak-stopwatch-import-source -D /tmp/i240
          test -f /tmp/i240/ios/IGNIDOWake/StreakParity.swift
          rm -rf ios/IGNIDOWake
          cp -R /tmp/i240/ios/IGNIDOWake ios/IGNIDOWake
          cp /tmp/i240/ios/project.yml ios/project.yml
      - run: python3 tools/patch_ios_v242_big_flame_ui.py
      - name: Validate
        run: |
          grep -q '<string>2.4.2</string>' ios/IGNIDOWake/Info.plist
          grep -q '<string>142</string>' ios/IGNIDOWake/Info.plist
          grep -q '.frame(height:320)' ios/IGNIDOWake/StreakParity.swift
          ! grep -q '.frame(width:150,height:190)' ios/IGNIDOWake/StreakParity.swift
          grep -q 'TimeLogImportSheet(request:' ios/IGNIDOWake/ClockViews.swift
      - run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project IGNIDOWake.xcodeproj -scheme IGNIDOWake -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '2.4.2'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '142'
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry IGNIDO-Wake-iOS-2.4.2-big-flame-ui.ipa Payload
          shasum -a 256 IGNIDO-Wake-iOS-2.4.2-big-flame-ui.ipa | tee IGNIDO-Wake-iOS-2.4.2-big-flame-ui.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-2.4.2-big-flame-ui-source
          path: |
            ios/IGNIDOWake/
            ios/project.yml
            tools/patch_ios_v242_big_flame_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-iOS-2.4.2-big-flame-ui
          path: |
            ios/IGNIDO-Wake-iOS-2.4.2-big-flame-ui.ipa
            ios/IGNIDO-Wake-iOS-2.4.2-big-flame-ui.sha256
