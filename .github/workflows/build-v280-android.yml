name: Build IGNIDO Wake Android 2.8.0 Backup + Snooze Cancel
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v280_backup_snooze_android.py'
      - '.github/workflows/build-v280-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct project shell
        run: |
          cat .wakeguard-parts/*.b64 | base64 --decode > WakeGuard-v0.5.0-source-fixed.zip
          unzip -q WakeGuard-v0.5.0-source-fixed.zip
      - name: Restore exact Android 2.7.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/a270 && mkdir -p /tmp/a270
          curl -L --fail --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/yuya02375-web/WakeGuard/actions/artifacts/11031280589/zip             -o /tmp/a270.zip
          unzip -q /tmp/a270.zip -d /tmp/a270
          test -f /tmp/a270/src/main/java/jp/wakeguard/alarm/MainActivity.java
          rm -rf WakeGuard/app
          mkdir -p WakeGuard/app
          cp -R /tmp/a270/. WakeGuard/app/
      - name: Apply Android 2.8.0 patch
        run: python3 tools/patch_v280_backup_snooze_android.py
      - name: Validate backup and snooze features
        run: |
          grep -q 'versionCode = 180' WakeGuard/app/build.gradle.kts
          grep -q 'versionName = "2.8.0"' WakeGuard/app/build.gradle.kts
          grep -q 'android:backupAgent=".IgnidoBackupAgent"' WakeGuard/app/src/main/AndroidManifest.xml
          grep -q 'BackupManager(context.getApplicationContext()).dataChanged()' WakeGuard/app/src/main/java/jp/wakeguard/alarm/BackupVault.java
          grep -q 'ENTITY_KEY = "ignido_state_v1"' WakeGuard/app/src/main/java/jp/wakeguard/alarm/BackupVault.java
          grep -q 'class IgnidoBackupAgent' WakeGuard/app/src/main/java/jp/wakeguard/alarm/IgnidoBackupAgent.java
          grep -q 'すべて取消' WakeGuard/app/src/main/java/jp/wakeguard/alarm/MainActivity.java
          grep -q 'スヌーズ中  ·  あと' WakeGuard/app/src/main/java/jp/wakeguard/alarm/MainActivity.java
          grep -q 'markAwake' WakeGuard/app/src/main/java/jp/wakeguard/alarm/SnoozeScheduler.java
          grep -q 'バックアップを書き出す' WakeGuard/app/src/main/java/jp/wakeguard/alarm/SystemSettingsActivity.java
          grep -q 'showImportFolderPicker' WakeGuard/app/src/main/java/jp/wakeguard/alarm/TimeLogActivity.java
          test -s WakeGuard/app/src/main/assets/dragon_realistic.glb
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.0-backup-snooze-source
          path: |
            WakeGuard/app/
            tools/patch_v280_backup_snooze_android.py
      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' WakeGuard/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' WakeGuard/gradle.properties
          else
            echo 'android.useAndroidX=true' >> WakeGuard/gradle.properties
          fi
      - name: Build APK
        working-directory: WakeGuard
        run: gradle assembleDebug --stacktrace
      - name: Restore stable signing key
        env:
          WAKEGUARD_KEYSTORE_B64: ${{ secrets.WAKEGUARD_KEYSTORE_B64 }}
        run: |
          CLEANED="$(printf '%s' "$WAKEGUARD_KEYSTORE_B64" | tr -d '\r\n\t ')"
          CLEANED="${CLEANED#WAKEGUARD_KEYSTORE_B64=}"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/wakeguard-release.p12"
          test -s "$RUNNER_TEMP/wakeguard-release.p12"
      - name: Sign and verify APK
        env:
          WAKEGUARD_KEYSTORE_PASSWORD: ${{ secrets.WAKEGUARD_KEYSTORE_PASSWORD }}
          WAKEGUARD_KEY_ALIAS: ${{ secrets.WAKEGUARD_KEY_ALIAS }}
          WAKEGUARD_KEY_PASSWORD: ${{ secrets.WAKEGUARD_KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/wakeguard-release.p12"             --ks-type PKCS12             --ks-key-alias "$WAKEGUARD_KEY_ALIAS"             --ks-pass env:WAKEGUARD_KEYSTORE_PASSWORD             --key-pass env:WAKEGUARD_KEY_PASSWORD             --v2-signing-enabled true             --v3-signing-enabled true             --out IGNIDO-Wake-Android-2.8.0-backup-snooze.apk             WakeGuard/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs IGNIDO-Wake-Android-2.8.0-backup-snooze.apk
          sha256sum IGNIDO-Wake-Android-2.8.0-backup-snooze.apk | tee IGNIDO-Wake-Android-2.8.0-backup-snooze.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IGNIDO-Wake-Android-2.8.0-backup-snooze
          path: |
            IGNIDO-Wake-Android-2.8.0-backup-snooze.apk
            IGNIDO-Wake-Android-2.8.0-backup-snooze.sha256
