<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャラクター案（幾何学・プレビュー）</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#1b2230;color:#e9eef6;font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif}
h1{font-size:20px;margin:0 0 8px}
.note{color:#9fb0c6;font-size:13px;line-height:1.7;margin:0 0 20px;max-width:900px}
.grid{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));gap:12px;align-items:center}
.head{margin-bottom:6px;color:#9fb0c6;font-size:13px;text-align:center}
.head div:first-child{text-align:left}
.row{margin-bottom:12px;--shade:color-mix(in srgb,var(--body) 72%,#000);--light:color-mix(in srgb,var(--body) 42%,#fff);--ink:#1b2230}
.name{font-size:15px;font-weight:700}
.name small{display:block;font-size:12px;font-weight:400;color:#9fb0c6;margin-top:3px}
.tile{background:#232b3a;border:1px solid #334055;border-radius:16px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:10px}
.tile svg{width:100%;height:100%;display:block}
.hidden-defs{position:absolute;width:0;height:0;overflow:hidden}
.p-glacier{--body:#7cbdf7;--acc:#91c8f8}
.p-lunar{--body:#aebbf9;--acc:#bbc6fa}
.p-sakura{--body:#f38eb5;--acc:#f5a0c1}
.p-evergreen{--body:#79c78a;--acc:#8ed09d}
.p-ruby{--body:#ff737f;--acc:#ff8993}
.p-terminal{--body:#5ddd94;--acc:#77e2a5}
</style>
</head>
<body>

</svg>

<h1>キャラクター案（幾何学・プレビュー）</h1>
<p class="note">体の色は、セットの配色（ダーク側の色）から作っています。形は、円・楕円・角丸の四角・三角と、単純な曲線だけで描いています。線の縁取りや影のぼかしは使っていません。</p>

<div class="grid head"><div></div><div>フクロウ</div><div>キツネ</div><div>ロボット</div><div>ドラゴン</div></div>

<div class="grid row p-glacier">
<div class="name">氷河<small>天空のドラゴン のセット</small></div>
<div class="tile"><svg viewBox="0 0 120 120"><use href="#owl"/></svg></div>
<div class="tile"><svg viewBox="0 0 120 120"><use href="#fox"/></svg></div>
<div class="tile"><svg viewBox="0 0 120 120"><use href="#robot"/></svg></div>
<div class="tile"><svg viewBox="0 0 120 120"><use href="#dragon"/></svg></div>
</div>

<div class="grid row p-lunar">
